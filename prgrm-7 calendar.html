<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yearly Calendar</title>
  <style>
    table { border-collapse: collapse; margin: 10px; display: inline-table; vertical-align: top; font-family: sans-serif; }
    th, td { border: 1px solid #333; width: 32px; height: 26px; text-align: center; }
    caption { font-weight: bold; margin-bottom: 5px; }
    th { background: #ddd; }
  </style>
</head>
<body>
  <h2 id="title"></h2>
  <div id="calendar"></div>

  <script>
    const year = parseInt(prompt("Enter the year (e.g. 2026):"), 10);

    if (!year || year < 1) {
      document.body.innerHTML = "<p>Invalid year entered.</p>";
    } else {
      document.getElementById("title").textContent = `Calendar for ${year}`;
      
      const months = ["January", "February", "March", "April", "May", "June", 
                      "July", "August", "September", "October", "November", "December"];
      const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

      let html = "";

      months.forEach((month, m) => {
        const firstDay = new Date(year, m, 1).getDay();
        const totalDays = new Date(year, m + 1, 0).getDate();

        // Create an array with leading empty cells + all date cells
        let cells = Array(firstDay).fill("<td></td>");
        for (let d = 1; d <= totalDays; d++) {
          cells.push(`<td>${d}</td>`);
        }

        // Group cells into rows of 7
        let rows = "";
        for (let i = 0; i < cells.length; i += 7) {
          rows += `<tr>${cells.slice(i, i + 7).join("")}</tr>`;
        }

        // Assemble the table
        html += `<table>
          <caption>${month} ${year}</caption>
          <tr>${days.map(d => `<th>${d}</th>`).join("")}</tr>
          ${rows}
        </table>`;
      });

      document.getElementById("calendar").innerHTML = html;
    }
  </script>
</body>
</html>
