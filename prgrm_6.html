<!DOCTYPE html>
<html>
<head>
    <title>String and Math Functions</title>
</head>
<body>
    <h2>javascript string and math function</h2>
    <script>
        let str="Web programming";
        document.write("<b>String:</b>"+str+"<br><br>");
        document.write("1.Length="+str.length+"<br>");
        document.write("2.Uppercase="+str.toUpperCase()+"<br>");
        document.write("3.Lowercase="+str.toLowerCase()+"<br>");
        document.write("4.Character at position 2="+str.charAt(2)+"<br>");
        document.write("Substring="+str.substring(0,3)+"<br><br>");
        document.write("<b>Math Function</b><br>");
        document.write("7.Squre Root of 25="+Math.pow)
        


    </script>
</body>


</html>
